# Render Blueprint for the hosted demo: one free web service runs both the API
# and the web app (scripts/hosted-demo-start.sh). The database is external
# (Supabase); paste its session pooler URL as DATABASE_URL when Render asks.
# Demo data is seeded on first start. Not for real money or real customers.
services:
  - type: web
    name: crypto-p2p-demo
    runtime: node
    plan: free
    region: singapore
    # Render builds as a non-root user, so `corepack enable` cannot link pnpm
    # into Node's bin folder. Run the pinned pnpm through npx instead.
    buildCommand: npx --yes pnpm@10.28.0 install --frozen-lockfile && npx --yes pnpm@10.28.0 -r build
    startCommand: ./scripts/hosted-demo-start.sh
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: require
      - key: DATABASE_POOL_MAX
        value: '5'
      - key: OTP_ENCRYPTION_KEY
        generateValue: true
      - key: PAYMENT_METHOD_COOLDOWN_HOURS
        value: '0'
      - key: ADDRESS_COOLDOWN_HOURS
        value: '0'
      # Email through Resend (see README "이메일 발송"). Left empty, emails are only written to the log.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Address in the signup confirmation link, e.g. https://p2pclub.biz. Defaults to the Render service URL.
      - key: APP_URL
        sync: false
      # Resend template id (or alias) for the signup confirmation email per language. Empty sends the built-in email.
      - key: RESEND_SIGNUP_TEMPLATE_KO
        sync: false
      - key: RESEND_SIGNUP_TEMPLATE_EN
        sync: false
      # Identity verification through Sumsub (see README "본인 인증 (Sumsub)"). All four are needed.
      - key: SUMSUB_APP_TOKEN
        sync: false
      - key: SUMSUB_SECRET_KEY
        sync: false
      - key: SUMSUB_WEBHOOK_SECRET
        sync: false
      - key: SUMSUB_LEVEL_NAME
        sync: false
